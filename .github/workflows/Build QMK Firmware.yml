name: Build QMK Firmware

on:
  push:
    branches: [ "hk-master" ]
  pull_request:
    branches: [ "hk-master" ]
  workflow_dispatch:
    inputs:
      keymap:
        description: 'ビルドするキーマップ名'
        required: true
        default: 'default'
      oled:
        description: 'OLEDを有効にするか (yes / no)'
        required: true
        default: 'yes'

jobs:
  build:
    runs-on: ubuntu-latest
    container: qmkfm/qmk_cli:latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Initialize QMK
      run: |
        qmk setup -y

    - name: Build Keyball61 Firmware
      run: |
        make holykeebs/keyball61:${{ github.event.inputs.keymap }} -e OLED=${{ github.event.inputs.oled }}

    - name: Check generated files
      run: |
        echo "=== Current Directory Files ==="
        ls -la *.hex *.bin *.uf2 2>/dev/null || true
        echo "=== QMK Home Directory Files ==="
        ls -la /root/qmk_firmware/*.hex /root/qmk_firmware/*.bin /root/qmk_firmware/*.uf2 2>/dev/null || true

    # 👇 プラグイン名を「upload-artifact」に修正し、ファイル検索の範囲を広げました
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: keyball61-${{ github.event.inputs.keymap }}-firmware
        path: |
          *.hex
          *.bin
          *.uf2
          /root/qmk_firmware/*.hex
          /root/qmk_firmware/*.bin
          /root/qmk_firmware/*.uf2
        if-no-files-found: error
