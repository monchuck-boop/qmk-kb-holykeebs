name: Build QMK Firmware

on:
  push:
    branches: [ "hk-master" ]
  pull_request:
    branches: [ "hk-master" ]
  workflow_dispatch:
    inputs:
      keymap:
        description: 'ビルドするキーマップ名'
        required: true
        default: 'via'
      oled:
        description: 'OLEDを有効にするか (yes / no)'
        required: true
        default: 'yes'

jobs:
  build:
    runs-on: ubuntu-latest
    container: qmkfm/qmk_cli:latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'
        fetch-depth: 0

    - name: Fix QMK Home and Git safe directory
      run: |
        # コンテナ内でGitエラー（not a git repo）が出ないようにディレクトリを安全な場所として登録
        git config --global --add safe.directory /__w/${{ github.event.repository.name }}/${{ github.event.repository.name }}
        qmk setup -y

    - name: Target Keymap Validation
      id: check_keymap
      run: |
        # 入力されたキーマップが存在しなければ自動で「via」に切り替える
        KM_INPUT="${{ github.event.inputs.keymap }}"
        if [ -d "keyboards/holykeebs/keyball61/keymaps/${KM_INPUT}" ]; then
          echo "KEYMAP_NAME=${KM_INPUT}" >> $GITHUB_ENV
        else
          echo "WARNING: Keymap '${KM_INPUT}' not found. Falling back to 'via'."
          echo "KEYMAP_NAME=via" >> $GITHUB_ENV
        fi

    - name: Build Keyball61 Firmware
      run: |
        # 正しい環境で元の信頼性の高い make コマンドを叩きます
        make holykeebs/keyball61:${{ env.KEYMAP_NAME }} -e OLED=${{ github.event.inputs.oled }}

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: keyball61-${{ env.KEYMAP_NAME }}-firmware
        path: |
          *.hex
          *.bin
          *.uf2
          .build/*.hex
          .build/*.bin
          .build/*.uf2
        if-no-files-found: error
